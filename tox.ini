[tox]
envlist = quality, docs, django42-drf315, django42-drflatest, django52-drf315, py
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
setenv =
    DJANGO_SETTINGS_MODULE = settings
    PYTHONPATH = {toxinidir}
dependency_groups =
    django42-drf315: django42-drf315
    django42-drflatest: django42-drflatest
    django52-drf315: django52-drf315
    py: test
allowlist_externals = make
commands =
    python -Wd -m pytest {posargs}

[testenv:quality]
runner = uv-venv-lock-runner
setenv =
    DJANGO_SETTINGS_MODULE = settings
    PYTHONPATH = {toxinidir}
dependency_groups = quality
allowlist_externals = make
commands =
    make test_quality

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
allowlist_externals = make
commands =
    make docs-html

[testenv:check_keywords]
runner = uv-venv-lock-runner
setenv =
    DJANGO_SETTINGS_MODULE = settings
    PYTHONPATH = {toxinidir}
dependency_groups = quality
allowlist_externals = make
commands =
    make check_keywords

[pycodestyle]
exclude = ./.*,./docs/source/conf.py,migrations
max-line-length = 120
