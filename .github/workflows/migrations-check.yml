name: Migrations check on mysql8

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  check_migrations:
    name: check migrations
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest ]
        python-version: [ "3.12" ]

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v6.5.0
      with:
        enable-cache: true
        python-version: "${{ matrix.python-version }}"

    - name: Install system Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libxmlsec1-dev

    - name: Ubuntu and MySQL Versions
      run: |
        lsb_release -a
        mysql -V

    - name: Install Python dependencies
      run: |
        uv sync --group test
        uv pip install --no-binary mysqlclient

    - name: Initiate Services
      run: |
        sudo /etc/init.d/mysql start

    - name: Reset mysql password
      run: |
        cat <<EOF | mysql -h 127.0.0.1 -u root --password=root
          UPDATE mysql.user SET authentication_string = null WHERE user = 'root';
          FLUSH PRIVILEGES;
        EOF

    - name: Run migrations
      env:
        DB_ENGINE: django.db.backends.mysql
        MYSQL_DATABASE: submissions_db
        MYSQL_USER: root
        MYSQL_ROOT_PASSWORD:
        MYSQL_HOST: localhost
        MYSQL_PORT: 3306
      run: |
        echo "CREATE DATABASE IF NOT EXISTS submissions_db;" | sudo mysql -u root
        echo "Testing migrations."
        if uv run python ./manage.py makemigrations --dry-run | grep -q 'No changes detected'; then
          echo "Migrations up to date."
        else
          echo "ERROR: Missing migration files for model changes. Run ./manage.py makemigrations"
          exit 1
        fi
